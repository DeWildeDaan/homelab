apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        loadBalancerIP: {{ .Values.traefik.loadBalancerIP }}
        externalTrafficPolicy: Local
    logs:
      access:
        enabled: true
        format: json
        fields:
          headers:
            defaultMode: keep
    ports:
      web:
        redirectTo:
          port: websecure
      websecure:
        tls:
          enabled: true
    tlsStore:
      default:
        defaultCertificate:
          secretName: {{ .Values.traefik.wildcardCertSecret }}
    additionalArguments:
      - "--experimental.plugins.traefik-oidc-auth.moduleName=github.com/sevensolutions/traefik-oidc-auth"
      - "--experimental.plugins.traefik-oidc-auth.version=v0.20.0"
      - "--experimental.plugins.bouncer.moduleName=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      - "--experimental.plugins.bouncer.version=v1.4.5"
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    deployment:
      additionalVolumes:
        - name: plugins-storage
          persistentVolumeClaim:
            claimName: traefik-plugins-storage
        - name: crowdsec-bouncer-key
          secret:
            secretName: crowdsec-bouncer-key
    additionalVolumeMounts:
      - name: plugins-storage
        mountPath: /plugins-storage
      - name: crowdsec-bouncer-key
        mountPath: /etc/traefik/crowdsec
        readOnly: true
    securityContext:
      readOnlyRootFilesystem: false
    podSecurityContext:
      fsGroup: 65532