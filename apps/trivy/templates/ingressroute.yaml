apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: trivy
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`trivy.home.daandewilde.be`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
          namespace: kube-system
        - name: pocket-id-admins
          namespace: kube-system
      services:
        - name: {{ .Release.Name }}-dashboard
          port: 8900
  tls: {}