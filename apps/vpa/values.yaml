vertical-pod-autoscaler:
  admissionController:
    enabled: true

    registerWebhook: false

    certGen:
      enabled: false

    certManager:
      enabled: true
      issuerRef:
        name: "selfsigned"
        kind: ClusterIssuer

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  recommender:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  updater:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  crds:
    create: true