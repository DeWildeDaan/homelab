---
# ============================================================================
# Ballast Redis — OT redis-operator standalone Redis (version-LESS name)
# ============================================================================
# Runs in the `ballast` namespace (co-located with the app). The operator
# creates a ClusterIP Service named exactly after this CR — `ballast-redis` on
# port 6379 — which Ballast reaches via store.endpoint (set in
# apps/ballast/values.yaml). Replaces the chart's bundled Valkey subchart
# (valkey.enabled: false there), same model as immich/paperless.
#
# AUTH: none — ClusterIP reachable only in-cluster, matching the other
# no-auth Redis CRs in this folder.
#
# PERSISTENCE: unlike the other Redis CRs here, this one IS a source of truth.
# Ballast's sample store has no TTL on "first-seen" markers, and readiness
# gates on minTimeSpan (24h of observed history) — losing the store resets
# every workload's profile to Accruing for a full day. So this mirrors the
# sizing rules from the chart's own valkey block (charts/ballast/values.yaml):
#   maxmemory  <  memory limit  <=  memory request
#   PVC size   ~=  2 x memory limit
# request == limit keeps the pod out of BestEffort QoS (the first thing the
# kubelet evicts under node memory pressure — exactly the failure that would
# wipe this store).
#
# Upgrade = bump the imageName tag below; the operator rolls the pod.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ballast-redis-config
  namespace: ballast
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
data:
  redis-additional.conf: |
    maxmemory 64mb
    maxmemory-policy noeviction
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: ballast-redis
  namespace: ballast
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  redisConfig:
    additionalRedisConfig: ballast-redis-config
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.4.8
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        memory: 96Mi
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 192Mi
