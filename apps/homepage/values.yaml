homepage:
  image:
    repository: ghcr.io/gethomepage/homepage
    tag: latest
    pullPolicy: IfNotPresent
  enableRbac: true
  serviceAccount:
    create: true
  env:
    HOMEPAGE_ALLOWED_HOSTS: homepage.home.daandewilde.be
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi


  config:
    services:
      - Infrastructure:
          - ArgoCD:
              icon: argo-cd.png
              href: https://argocd.home.daandewilde.be
              description: GitOps & deployments

          - PocketID:
              icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/pocket-id.png
              href: https://auth.home.daandewilde.be
              description: Authentication

          - Longhorn:
              icon: longhorn.png
              href: https://longhorn.home.daandewilde.be
              description: Kubernetes storage

          - AdGuard Home:
              icon: adguard-home.png
              href: https://adguard.home.daandewilde.be
              description: DNS & ad blocking

          - CrowdSec:
              icon: crowdsec.png
              href: https://crowdsec.home.daandewilde.be
              description: Security & threat detection

      - Media:
          - Jellyfin:
              icon: jellyfin.png
              href: https://jellyfin.home.daandewilde.be
              description: Media server

          - Jellyseerr:
              icon: jellyseerr.png
              href: https://jellyseerr.home.daandewilde.be
              description: Media requests

          - Sonarr:
              icon: sonarr.png
              href: https://sonarr.home.daandewilde.be
              description: TV management

          - Radarr:
              icon: radarr.png
              href: https://radarr.home.daandewilde.be
              description: Movie management

          - Prowlarr:
              icon: prowlarr.png
              href: https://prowlarr.home.daandewilde.be
              description: Indexer management

          - Bazarr:
              icon: bazarr.png
              href: https://bazarr.home.daandewilde.be
              description: Subtitle management

          - qBittorrent:
              icon: qbittorrent.png
              href: https://qbittorrent.home.daandewilde.be
              description: Download client

          - Maintainerr:
              icon: maintainerr.png
              href: https://maintainerr.home.daandewilde.be
              description: Media library cleanup

      - Applications:
          - Immich:
              icon: immich.png
              href: https://immich.home.daandewilde.be
              description: Photo & video library

          - Paperless:
              icon: paperless-ngx.png
              href: https://paperless.home.daandewilde.be
              description: Document management

          - Vaultwarden:
              icon: vaultwarden.png
              href: https://vaultwarden.home.daandewilde.be
              description: Password manager

          - Wealthfolio:
              icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/wealthfolio.png
              href: https://wealthfolio.home.daandewilde.be
              description: Personal finance

          - Wardrowbe:
              icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/wardrowbe.png
              href: https://wardrobe.home.daandewilde.be
              description: Wardrobe management

          - BentoPDF:
              icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/bentopdf.png
              href: https://pdf.home.daandewilde.be
              description: PDF tools

      - Smart Home:
          - Home Assistant:
              icon: home-assistant.png
              href: http://192.168.3.10:8123/home-dashboard/home
              description: Home automation

      - Hardware:
          - Synology NAS:
              icon: synology.png
              href: https://192.168.4.10:5001
              description: NAS management

          - Proxmox VE 0:
              icon: proxmox.png
              href: https://192.168.3.11:8006
              description: Virtualization host

          - Proxmox VE 1:
              icon: proxmox.png
              href: https://192.168.4.11:8006
              description: Virtualization host

          - Proxmox VE 2:
              icon: proxmox.png
              href: https://192.168.4.12:8006
              description: Virtualization host

          - Proxmox VE 3:
              icon: proxmox.png
              href: https://192.168.4.13:8006
              description: Virtualization host

    widgets:
      - kubernetes:
          cluster:
            show: true
            cpu: true
            memory: true
            showLabel: true
            label: homelab
          nodes:
            show: true
            cpu: true
            memory: true
            showLabel: true
      - search:
          provider: google
          target: _blank

    kubernetes:
      mode: cluster

    settings:
      title: Homelab
      favicon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/homepage.png
      theme: dark
      color: slate
      headerStyle: clean

      layout:
        Infrastructure:
          style: row
          columns: 4

        Media:
          style: row
          columns: 4

        Applications:
          style: row
          columns: 4

        Smart Home:
          style: row
          columns: 4

        Hardware:
          style: row
          columns: 4

    docker: {}