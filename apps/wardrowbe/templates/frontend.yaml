apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardrowbe-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wardrowbe.frontend.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wardrowbe.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wardrowbe.frontend.labels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.frontendTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: BACKEND_URL
              value: "http://wardrowbe-backend:8000"
            - name: NEXTAUTH_URL
              value: "{{ .Values.ingress.url }}"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: NEXTAUTH_SECRET
            {{- include "wardrowbe.oidcEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wardrowbe-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wardrowbe.frontend.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "wardrowbe.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
