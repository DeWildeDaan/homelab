apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    SECRET_KEY: {{ .Values.secrets.encryptedSecretKey }}
    NEXTAUTH_SECRET: {{ .Values.secrets.encryptedNextauthSecret }}
    OIDC_CLIENT_SECRET: {{ .Values.secrets.encryptedOidcClientSecret }}
    # Consumed by the wardrowbe-redis CR (apps/redis-operator) and by the
    # backend/worker REDIS_URL. Keep the key name `redis-password`.
    redis-password: {{ .Values.secrets.encryptedRedisPassword }}
  template:
    metadata:
      name: {{ .Values.secrets.name }}
      namespace: {{ .Release.Namespace }}
    type: Opaque
