image:
  repository: ghcr.io/anyesh/wardrowbe
  backendTag: "backend-1.5.1"
  frontendTag: "frontend-1.5.1"
  pullPolicy: IfNotPresent

ingress:
  host: wardrobe.home.daandewilde.be
  url: https://wardrobe.home.daandewilde.be

persistence:
  storageClass: nfs-nas
  size: 100Gi

# CloudNativePG cluster
db:
  host: wardrowbe-db-rw
  user: wardrowbe
  name: wardrowbe
  appSecret: wardrowbe-db-app

# redis-operator Redis CR
redis:
  host: wardrowbe-redis

ai:
  internalEnabled: true
  visionEnabled: true
  textEnabled: true
  baseUrl: http://ollama.ollama.svc.cluster.local:11434/v1
  apiKey: not-needed
  visionModel: gemma3:4b
  textModel: gemma3:4b
  timeout: 600
  maxRetries: 3

oidc:
  issuerUrl: https://auth.home.daandewilde.be
  clientId: "1b238c41-9696-4455-8cb6-2b6d4e46066a"

secrets:
  name: wardrowbe-secrets
  encryptedSecretKey: ""
  encryptedNextauthSecret: ""
  encryptedOidcClientSecret: ""
  encryptedRedisPassword: ""

backend:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

frontend:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

worker:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
