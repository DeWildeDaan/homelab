hub:
  image:
    repository: henrygd/beszel
    tag: "0.18.7"
    pullPolicy: IfNotPresent

  replicaCount: 1

  env:
    APP_URL: "https://beszel.home.daandewilde.be"
    USER_CREATION: "false"
    DISABLE_PASSWORD_AUTH: "true"

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  persistence:
    storageClass: nfs-nas
    size: 100Gi
    accessMode: ReadWriteOnce

  service:
    port: 8090

agent:
  image:
    repository: henrygd/beszel-agent
    tag: "0.18.7"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

  env:
    HUB_URL: "http://beszel-hub.beszel.svc.cluster.local:8090"
    LISTEN: "45876"

  service:
    port: 45876

oidc:
  existingSecret: beszel-oidc-secret

ingress:
  host: beszel.home.daandewilde.be