apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel-hub
  namespace: beszel
  labels:
    app.kubernetes.io/name: beszel-hub
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.hub.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: beszel-hub
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beszel-hub
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: beszel-hub
          image: "{{ .Values.hub.image.repository }}:{{ .Values.hub.image.tag }}"
          imagePullPolicy: {{ .Values.hub.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: APP_URL
              value: {{ .Values.hub.env.APP_URL | quote }}
            - name: USER_CREATION
              value: {{ .Values.hub.env.USER_CREATION | quote }}
            - name: DISABLE_PASSWORD_AUTH
              value: {{ .Values.hub.env.DISABLE_PASSWORD_AUTH | quote }}
          volumeMounts:
            - name: data
              mountPath: /beszel_data
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.agent.resources.requests.cpu }}
              memory: {{ .Values.agent.resources.requests.memory }}
            limits:
              cpu: {{ .Values.agent.resources.limits.cpu }}
              memory: {{ .Values.agent.resources.limits.memory }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: beszel-hub-data