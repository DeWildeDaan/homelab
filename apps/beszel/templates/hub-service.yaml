apiVersion: v1
kind: Service
metadata:
  name: beszel-hub
  namespace: beszel
  labels:
    app.kubernetes.io/name: beszel-hub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: beszel-hub
  ports:
    - name: http
      port: {{ .Values.hub.service.port }}
      targetPort: http
      protocol: TCP