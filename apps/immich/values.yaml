# Postgres is a CloudNativePG `Cluster` (immich-db) defined in
# apps/cloudnative-pg/templates/immich-db.yaml — all CNPG clusters live in that
# one folder. It runs in THIS namespace; Immich connects as the postgres
# superuser over the in-namespace service immich-db-rw (see DB_* env below).
# The old hand-rolled postgres Deployment was decommissioned.

# Library PVC — Immich's chart refuses to create this for you, so it lives
# in templates/library-pvc.yaml. Backed by the Synology over NFS.
library:
  size: 1Ti
  storageClass: nfs-nas

ingress:
  host: immich.home.daandewilde.be

# ---------------------------------------------------------------------------
# Upstream immich chart values
# ---------------------------------------------------------------------------
immich:
  immich:
    persistence:
      library:
        existingClaim: immich-library

  # DB connection — points at the CloudNativePG cluster immich-db, defined in
  # apps/cloudnative-pg/templates/immich-db.yaml (runs in this namespace). Immich
  # connects as the postgres superuser via the immich-db-superuser secret. A
  # future major upgrade is an in-place imageName tag bump on that cluster — this
  # host/secret stays the same. The old in-repo postgres stays until Phase 3.
  controllers:
    main:
      containers:
        main:
          env:
            DB_HOSTNAME: immich-db-rw
            DB_USERNAME: postgres
            DB_DATABASE_NAME: immich
            DB_PORT: "5432"
            DB_VECTOR_EXTENSION: vectorchord
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-db-superuser
                  key: password
            # Redis — points at the operator-managed `Redis` CR (immich-redis),
            # defined in apps/redis-operator/templates/immich-redis.yaml (runs in
            # this namespace). Overrides the chart default REDIS_HOSTNAME, which
            # would otherwise point at the now-disabled bundled valkey. No auth,
            # matching the old bundled valkey's in-cluster posture.
            REDIS_HOSTNAME: immich-redis
            REDIS_PORT: "6379"

  # Redis — the bundled Valkey subchart is disabled; replaced by the
  # operator-managed `Redis` CR (immich-redis) in apps/redis-operator, wired via
  # REDIS_HOSTNAME/REDIS_PORT above. Same model as the CloudNativePG database:
  # one operator, one CR per app, upgrades handled by the operator.
  valkey:
    enabled: false

  # ML model cache — persist so models aren't re-downloaded on every restart.
  machine-learning:
    enabled: true
    persistence:
      cache:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        storageClass: nfs-nas
        size: 10Gi

  # Server — ingress disabled; Traefik IngressRoute lives in templates/.
  # The chart's default ClusterIP service is flipped to LoadBalancer so
  # MetalLB pins it to the LAN IP below (same pattern as adguard).
  server:
    enabled: true
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: 192.168.4.32
        externalTrafficPolicy: Cluster
    ingress:
      main:
        enabled: false
