apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ballast-opt-in
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: false
  rules:
    - name: inject-ballast-mode
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - ballast
                - kube-system
                - kube-public
                - kube-node-lease
                - metallb
                - nfs-storage
                - default
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              ballast.tightlinesoftware.com/mode: measure

    - name: backfill-name-label
      match:
        any:
          - resources:
              kinds:
                - Pod
      preconditions:
        all:
          - key: "{{ request.object.metadata.labels.\"ballast.tightlinesoftware.com/mode\" || '' }}"
            operator: NotEquals
            value: ""
          - key: "{{ request.object.metadata.labels.\"app.kubernetes.io/name\" || '' }}"
            operator: Equals
            value: ""
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              app.kubernetes.io/name: "{{ request.object.metadata.labels.app || request.object.metadata.labels.\"k8s-app\" || request.object.metadata.labels.name || request.object.metadata.labels.\"longhorn.io/component\" || 'unknown' }}"
