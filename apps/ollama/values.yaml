ollama:
  image:
    repository: ollama/ollama
    tag: "0.32.6"
    pullPolicy: IfNotPresent

  service:
    port: 11434

  persistence:
    storageClass: nfs-nas
    size: 500Gi

  resources:
    requests:
      cpu: 250m
      memory: 4Gi
    limits:
      cpu: "6"
      memory: 10Gi

openWebui:
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: "v0.11.0"
    pullPolicy: IfNotPresent

  service:
    port: 8080

  persistence:
    storageClass: longhorn
    size: 2Gi

  # Must stay true — Open WebUI's auth layer is what OAuth/OIDC plugs into.
  # (WEBUI_AUTH=false disables authentication entirely, including SSO.)
  auth: true
  loginForm: false

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 6Gi

ingress:
  host: ollama.home.daandewilde.be
  url: https://ollama.home.daandewilde.be

oidc:
  providerUrl: https://auth.home.daandewilde.be/.well-known/openid-configuration
  providerName: "Pocket ID"
  scopes: "openid email profile groups"
  codeChallengeMethod: "S256"
  clientId: "d90896ff-9dd2-42f8-84d7-385db5d250a0"
  redirectUri: https://ollama.home.daandewilde.be/oauth/oidc/callback
  roleManagement: true
  rolesClaim: groups
  allowedRoles: "admin,non_admin"
  adminRoles: "admin"

secrets:
  name: ollama-secrets
  encryptedOidcClientSecret: ""
