ingress:
  host: argocd.home.daandewilde.be

argo-cd:
  global:
    domain: argocd.home.daandewilde.be

  configs:
    secret:
      createSecret: false
    params:
      server.insecure: true
    cm:
      admin.enabled: false
      statusbadge.enabled: true
      url: https://argocd.home.daandewilde.be

      oidc.config: |
        name: PocketID
        issuer: https://auth.home.daandewilde.be
        clientID: 8b194a3e-2be3-43e1-bab1-4bf00fe389c9
        clientSecret: $argocd-oidc-secret:oidc.clientSecret
        requestedScopes:
          - openid
          - profile
          - email
          - groups

    rbac:
      policy.default: role:readonly
      policy.csv: |
        g, admin, role:admin

  controller:
    replicas: 2
  applicationSet:
    replicas: 2
  server:
    replicas: 1
    # extensions:
    #   enabled: true
    #   extensionList:
    #     - name: trivy-insights
    #       env:
    #         - name: EXTENSION_URL
    #           value: https://github.com/DeWildeDaan/argo-trivy-insights/releases/latest/download/extension-trivy-insights.tar.gz
    #         - name: EXTENSION_CHECKSUM_URL
    #           value: https://github.com/DeWildeDaan/argo-trivy-insights/releases/latest/download/extension-trivy-insights_checksums.txt
  redis:
    serviceAccount:
      create: true
      automountServiceAccountToken: false