apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-home
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      middlewares:
        # - name: crowdsec-bouncer
        #   namespace: kube-system
      services:
        - name: argocd-server
          port: 80
  tls: {}
