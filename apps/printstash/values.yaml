replicaCount: 1

image:
  repository: ghcr.io/xiao-villamor/printstash
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 3000
  
puid: 1024
pgid: 100

ingress:
  host: printstash.home.daandewilde.be
  url: https://printstash.home.daandewilde.be

persistence:
  vault:
    storageClass: nfs-nas
    size: 220Gi
  backups:
    storageClass: nfs-nas
    size: 20Gi
  db:
    storageClass: longhorn
    size: 2Gi
  staging:
    storageClass: nfs-nas
    size: 20Gi

oidc:
  issuerUrl: https://auth.home.daandewilde.be
  clientId: "97daa2e9-0364-4c2d-afe6-391cd483dfe4"
  redirectUri: https://printstash.home.daandewilde.be/api/v1/auth/oidc/callback
  adminGroups: "admin"

secrets:
  name: printstash-secrets
  encryptedJwtSecret: ""
  encryptedOidcClientSecret: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
