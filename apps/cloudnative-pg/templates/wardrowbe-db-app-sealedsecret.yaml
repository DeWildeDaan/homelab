---
# Application-role credentials for the Wardrowbe CNPG cluster. Referenced via
# bootstrap.initdb.secret.name in wardrowbe-db.yaml and by the app's DATABASE_URL.
#
# Lives in the `wardrowbe` namespace (explicit — this chart's release ns is
# cloudnative-pg) so both CNPG and the wardrowbe pods can read it. Must be type
# kubernetes.io/basic-auth; `username` must match the cluster owner (`wardrowbe`).
# Synced before the Cluster (wave 1 < 2). Use a URL-safe (hex) password since it
# is embedded in DATABASE_URL.
#
# Re-seal (namespace + name are baked into the ciphertext — keep both exactly):
#   echo -n 'wardrowbe' | kubeseal --controller-name sealed-secrets-controller \
#     --controller-namespace sealed-secrets --raw \
#     --namespace wardrowbe --name wardrowbe-db-app        # → username
#   openssl rand -hex 24 | tr -d '\n' | kubeseal --controller-name sealed-secrets-controller \
#     --controller-namespace sealed-secrets --raw \
#     --namespace wardrowbe --name wardrowbe-db-app        # → password
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wardrowbe-db-app
  namespace: wardrowbe
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  encryptedData:
    username: 
    password: 
  template:
    metadata:
      name: wardrowbe-db-app
      namespace: wardrowbe
    type: kubernetes.io/basic-auth
