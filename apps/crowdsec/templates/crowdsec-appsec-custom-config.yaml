apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-appsec-custom-config
  namespace: crowdsec
data:
  jellyfin-exceptions.yaml: |
    name: custom/jellyfin-exceptions
    pre_eval:
      - filter: req.URL.Host == "jellyfin.home.daandewilde.be" && (req.URL.Path startsWith "/Sessions/" || req.URL.Path startsWith "/Items/" || req.URL.Path startsWith "/Playback/")
        apply:
          - SetRemediation("allow")