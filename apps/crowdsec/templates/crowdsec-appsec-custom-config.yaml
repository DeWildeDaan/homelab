apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-appsec-custom-config
  namespace: crowdsec
data:
  jellyfin.yaml: |
    name: custom/jellyfin-appsec-config
    description: "Jellyfin-specific AppSec config with false positive exceptions"
    default_remediation: ban
    outofband_rules:
      - crowdsecurity/crs
    inband_rules:
      - crowdsecurity/vpatch-*
    on_load:
      - apply:
          - SetRemediationByTag("crowdsecurity/crs", "pass", "custom/jellyfin-playback-exception")