grafana-alloy:
  alloy:
    # One of "experimental", "public-preview", or "generally-available".
    stabilityLevel: "generally-available"
    configMap:
      create: false
      name: alloy-config
      key: config.alloy
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: faro
        port: 4319
        targetPort: 4319
        protocol: TCP
  serviceAccount:
    create: true
  ingress:
    enabled: false
