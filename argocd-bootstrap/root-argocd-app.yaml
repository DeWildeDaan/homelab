# manually applied -> deploys appset -> deploys all apps + lets ArgoCD self manage
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DeWildeDaan/homelab
    targetRevision: HEAD
    path: applicationset
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true